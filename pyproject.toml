[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "incar-eval"
version = "0.1.0"
description = "Internal evaluation benchmark for an in-car voice assistant"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]
live = ["anthropic>=0.40"]  # only for LiveModelClient; never needed by tests/CI

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true

# anthropic is an optional dependency (the `live` extra), not installed in CI.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true
