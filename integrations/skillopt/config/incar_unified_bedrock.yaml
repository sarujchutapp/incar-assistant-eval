# Copy to <skillopt>/configs/incar_unified_bedrock/default.yaml
# Unified env, but the OPTIMIZER routes through the LiteLLM/Bedrock proxy (capped)
# while the TARGET stays on local Ollama (free). SkillOpt holds no AWS creds — it
# only talks to the two localhost endpoints below.
_base_: ../_base_/default.yaml

model:
  optimizer_backend: openai_chat
  target_backend: openai_chat
  # optimizer -> LiteLLM proxy (which caps + forwards to Bedrock)
  optimizer_azure_openai_endpoint: "http://localhost:4000/v1"
  optimizer_azure_openai_api_key: "sk-litellm-CHANGEME"   # = the proxy master_key
  optimizer_azure_openai_auth_mode: "openai_compatible"
  # target -> local Ollama (free), same as the other envs
  target_azure_openai_endpoint: "http://localhost:11434/v1"
  target_azure_openai_api_key: "ollama"
  target_azure_openai_auth_mode: "openai_compatible"
  reasoning_effort: ""
  rewrite_max_completion_tokens: 4096   # cap optimizer rewrite output (base default is 64000 = ~$1/call on Sonnet)

train:
  num_epochs: 1        # keep the first capped run TINY
  train_size: 0
  batch_size: 20
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8

optimizer:
  learning_rate: 4

evaluation:
  use_gate: true
  gate_metric: mixed
  gate_mixed_weight: 0.5
  gate_aggregation: min   # gate on the WORST case_type, not the pooled avg — so a
                          # candidate can't trade chat away to boost command
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

env:
  name: incar_unified
  skill_init: skillopt/envs/incar_unified/skills/initial.md
  split_mode: split_dir
  split_dir: data/incar_unified_split
  data_path: ""
  split_output_dir: ""
  max_completion_tokens: 1024
  workers: 8
  limit: 0
