# Copy to <skillopt>/configs/incar_toolcalling/default.yaml
_base_: ../_base_/default.yaml

model:
  reasoning_effort: ""   # target/optimizer models come from --target_model / --optimizer_model
                         # (see scripts/run_incar.sh). Backend inherits openai_chat -> your
                         # Ollama endpoint from .env (AZURE_OPENAI_ENDPOINT=localhost:11434/v1).

train:
  num_epochs: 4
  train_size: 0        # 0 = derive from the train split (40 synth cases)
  batch_size: 20
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8

optimizer:
  learning_rate: 4

evaluation:
  use_gate: true
  gate_metric: mixed   # small (12-case) val split -> a pure `hard` gate can reject
  gate_mixed_weight: 0.5   # every candidate; blends success (hard) with the graded
                           # soft signal. Set to `hard` once the corpus grows (#10).
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

env:
  name: incar_toolcalling
  skill_init: skillopt/envs/incar_toolcalling/skills/initial.md
  split_mode: split_dir
  split_dir: data/incar_toolcalling_split
  data_path: ""
  split_output_dir: ""
  max_completion_tokens: 4096
  workers: 8
  limit: 0
