# Deterministic feedback loops gating merge requests.
# Installs the package with dev extras and runs the same two commands a
# developer runs locally (`python -m pytest`, `python -m mypy`). Fixtures only —
# no network / no live model API is touched.

image: python:3.12-slim

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - python -m pip install --upgrade pip
  - pip install -e ".[dev]"

pytest:
  stage: test
  script:
    - python -m pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

mypy:
  stage: test
  script:
    - python -m mypy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
